name: Deploy to GitHub Pages

on:
  push:
    branches: [main, homolog]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'homolog' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_ENV: ${{ vars.VITE_APP_ENV }}
        run: npm run build

      - name: Publish to gh-pages branch
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages:gh-pages
            git worktree add _pages gh-pages
          else
            git worktree add --orphan -b gh-pages _pages
          fi

          if [ "${{ github.ref_name }}" = "main" ]; then
            find _pages -mindepth 1 -maxdepth 1 ! -name '.git' ! -name 'homolog' -exec rm -rf {} +
            cp -R dist/. _pages/
          else
            rm -rf _pages/homolog
            mkdir -p _pages/homolog
            cp -R dist/. _pages/homolog/
          fi

          touch _pages/.nojekyll
          cd _pages
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "deploy(${{ github.ref_name }}): ${{ github.sha }}"
            git push origin gh-pages
          fi
